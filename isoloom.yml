# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# GOAD DRACARYS: one domain on Windows Server 2025, and an Ubuntu machine.
# Isoloom builds the machines; GOAD's own playbooks build the lab from a controller.
version: 1
name: dracarys

networks:
  lab: {cidr: 192.168.56.0/24}

common:
  resources: {cpus: 2, memory_mb: 3000}

# The two Windows boxes share GOAD's Server 2025 image (WinRM over HTTPS) and the WinRM step.
groups:
  win2025:
    members: [dc01, srv01]
    vm:
      os: windows-server-2025
      image:
        vagrant: GOAD/WindowsServer2025
        vagrant_version: "2026.02.09"
        winrm: ssl
      provision: [vagrant/ConfigureRemotingForAnsible.ps1]

machines:
  dc01:
    networks: {lab: 10}
    vm: {}
    ports:
      dns:
        port: 53
      kerberos:
        port: 88
      ldap:
        port: 389
      smb:
        port: 445

  srv01:
    networks: {lab: 11}
    vm: {}
    ports:
      smb:
        port: 445

  lx01:
    networks: {lab: 12}
    resources: {cpus: 2, memory_mb: 2000}
    vm:
      os: ubuntu-24.04
      # GOAD's own box for this lab.
      image:
        vagrant: bento/ubuntu-24.04
        vagrant_version: "202510.26.0"

    ports:
      ssh:
        port: 22
provision:
  - ansible: ansible/dracarys.yml
    requirements: ansible/requirements_311.yml
    # The lab's own per-host variables (which domain each machine belongs to) and the keyboard layouts.
    inventory: [ad/DRACARYS/data/inventory]
    # What each machine plays in the lab: the groups GOAD's playbooks target.
    groups:
      domain: [dc01, srv01]
      linux_domain: [lx01]
      dc: [dc01]
      server: [srv01]
      parent_dc: [dc01]
      update: [dc01]
      no_update: [srv01]
      defender_on: [dc01, srv01]
      glpi: [lx01]
      klink: [srv01]
      keepass: [srv01]
    # The lab's settings, as GOAD's playbooks read them.
    vars:
      domain_name: DRACARYS
      admin_user: administrator
      add_route: 'no'
      route_gateway: 192.168.56.1
      route_network: 10.0.0.0/8
      enable_http_proxy: 'no'
      ad_http_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      ad_https_proxy: 'http://{{proxy_ip}}:{{proxy_port}}'
      force_dns_server: 'no'
      dns_server: 1.1.1.1
      dns_server_forwarder: 1.1.1.1
      proxy_ip: 'x.x.x.x'
      proxy_port: '8080'

message: |
  DRACARYS is up: the domain controller at {{ machines.dc01.addresses.lab }}, the server at
  {{ machines.srv01.addresses.lab }}, the Linux box at {{ machines.lx01.addresses.lab }}.
